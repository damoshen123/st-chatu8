<div id="ch-tab-runninghub_video">
    <!-- 图生视频工作流管理 -->
    <div class="st-chatu8-settings-section">

                    </button>
                    <div class="st-chatu8-preset-box-dropdown">
                        <div class="st-chatu8-preset-box-header">
                            <span class="st-chatu8-preset-box-title"><i class="fa-solid fa-box-archive"></i> 工作流操作</span>
                            <button type="button" class="st-chatu8-preset-box-close" title="关闭">&times;</button>
                        </div>
                        <div class="st-chatu8-preset-box-group">
                            <span class="st-chatu8-preset-box-group-label">预设管理</span>
                            <div class="st-chatu8-preset-box-grid">
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_img2vid_worker_new" title="新建预设"><i class="fa-solid fa-plus"></i><span>新建</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_img2vid_worker_update_style" title="保存修改"><i class="fa-solid fa-save"></i><span>保存</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_img2vid_worker_save_style" title="另存为新预设"><i class="fa-solid fa-file-export"></i><span>另存为</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_img2vid_worker_rename" title="重命名预设"><i class="fa-solid fa-pen"></i><span>重命名</span></button>
                            </div>
                        </div>
                        <div class="st-chatu8-preset-box-group">
                            <span class="st-chatu8-preset-box-group-label">导入与导出</span>
                            <div class="st-chatu8-preset-box-grid">
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_img2vid_worker_export_current" title="导出当前预设"><i class="fa-solid fa-upload"></i><span>导出当前</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_img2vid_worker_export_all" title="导出全部预设"><i class="fa-solid fa-file-export"></i><span>导出全部</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_img2vid_worker_import" title="导入预设文件"><i class="fa-solid fa-download"></i><span>导入</span></button>
                            </div>
                        </div>
                        <div class="st-chatu8-preset-box-group">
                            <span class="st-chatu8-preset-box-group-label">危险操作</span>
                            <div class="st-chatu8-preset-box-grid">
                                <button type="button" class="st-chatu8-preset-box-item danger" id="runninghub_img2vid_worker_delete_style" title="删除预设"><i class="fa-solid fa-trash"></i><span>删除预设</span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="runninghub_img2vid_workflowId">工作流 ID (与当前预设绑定)</label>
            <div class="st-chatu8-input-group">
                <input type="text" id="runninghub_img2vid_workflowId" class="st-chatu8-text-input" placeholder="输入该图生视频工作流预设对应的 RunningHub Workflow ID">
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="runninghub_img2vid_worker">图生视频工作流 (JSON 模板)</label>
            <textarea id="runninghub_img2vid_worker" class="st-chatu8-textarea" rows="6" style="font-family: monospace; white-space: pre;"></textarea>
            <div style="display: flex; gap: 10px; align-self: flex-end; margin-top: 10px;">
                <button id="inherit_runninghub_img2vid_work" class="st-chatu8-btn" title="选择其他工作流作为父工作流，按节点 ID 继承占位符配置"><i class="fa-solid fa-code-fork"></i> 继承修改</button>
                <button id="visualize_runninghub_img2vid_workflow" class="st-chatu8-btn"><i class="fa-solid fa-diagram-project"></i> 可视化修改</button>
            </div>
        </div>
    </div>

    <!-- 参考生视频工作流管理 -->
    <div class="st-chatu8-settings-section">
        <h3>参考生视频工作流</h3>
        <div class="st-chatu8-field">

            <div class="st-chatu8-profile-controls">
                <select id="runninghub_ref2vid_workerid" class="st-chatu8-select"></select>
                <div class="st-chatu8-preset-box-wrapper">
                    <button type="button" class="st-chatu8-icon-btn st-chatu8-preset-box-btn" title="预设操作收纳盒">
                        <i class="fa-solid fa-table-cells"></i>
                    </button>
                    <div class="st-chatu8-preset-box-dropdown">
                        <div class="st-chatu8-preset-box-header">
                            <span class="st-chatu8-preset-box-title"><i class="fa-solid fa-box-archive"></i> 工作流操作</span>
                            <button type="button" class="st-chatu8-preset-box-close" title="关闭">&times;</button>
                        </div>
                        <div class="st-chatu8-preset-box-group">
                            <span class="st-chatu8-preset-box-group-label">预设管理</span>
                            <div class="st-chatu8-preset-box-grid">
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_ref2vid_worker_new" title="新建预设"><i class="fa-solid fa-plus"></i><span>新建</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_ref2vid_worker_update_style" title="保存修改"><i class="fa-solid fa-save"></i><span>保存</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_ref2vid_worker_save_style" title="另存为新预设"><i class="fa-solid fa-file-export"></i><span>另存为</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_ref2vid_worker_rename" title="重命名预设"><i class="fa-solid fa-pen"></i><span>重命名</span></button>
                            </div>
                        </div>
                        <div class="st-chatu8-preset-box-group">
                            <span class="st-chatu8-preset-box-group-label">导入与导出</span>
                            <div class="st-chatu8-preset-box-grid">
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_ref2vid_worker_export_current" title="导出当前预设"><i class="fa-solid fa-upload"></i><span>导出当前</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_ref2vid_worker_export_all" title="导出全部预设"><i class="fa-solid fa-file-export"></i><span>导出全部</span></button>
                                <button type="button" class="st-chatu8-preset-box-item" id="runninghub_ref2vid_worker_import" title="导入预设文件"><i class="fa-solid fa-download"></i><span>导入</span></button>
                            </div>
                        </div>
                        <div class="st-chatu8-preset-box-group">
                            <span class="st-chatu8-preset-box-group-label">危险操作</span>
                            <div class="st-chatu8-preset-box-grid">
                                <button type="button" class="st-chatu8-preset-box-item danger" id="runninghub_ref2vid_worker_delete_style" title="删除预设"><i class="fa-solid fa-trash"></i><span>删除预设</span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="runninghub_ref2vid_workflowId">工作流 ID (与当前预设绑定)</label>
            <div class="st-chatu8-input-group">
                <input type="text" id="runninghub_ref2vid_workflowId" class="st-chatu8-text-input" placeholder="输入该参考生视频工作流预设对应的 RunningHub Workflow ID">
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="runninghub_ref2vid_worker">参考生视频工作流 (JSON 模板)</label>
            <textarea id="runninghub_ref2vid_worker" class="st-chatu8-textarea" rows="6" style="font-family: monospace; white-space: pre;"></textarea>
            <div style="display: flex; gap: 10px; align-self: flex-end; margin-top: 10px;">
                <button id="inherit_runninghub_ref2vid_work" class="st-chatu8-btn" title="选择其他工作流作为父工作流，按节点 ID 继承占位符配置"><i class="fa-solid fa-code-fork"></i> 继承修改</button>
                <button id="visualize_runninghub_ref2vid_workflow" class="st-chatu8-btn"><i class="fa-solid fa-diagram-project"></i> 可视化修改</button>
            </div>
        </div>
    </div>


    <!-- 生成参数 -->
    <div class="st-chatu8-settings-section">
        <h4>生成参数</h4>
        <div class="st-chatu8-grid">
            <div class="st-chatu8-field">
                <label for="runninghub_val_duration">视频秒数 (%视频秒数%)</label>
                <input type="number" id="runninghub_val_duration" class="st-chatu8-text-input" value="4" step="0.5">
            </div>
            <div class="st-chatu8-field">
                <label for="runninghub_val_steps">视频步数 (%步数%)</label>
                <input type="number" id="runninghub_val_steps" class="st-chatu8-text-input" value="6">
            </div>
            <div class="st-chatu8-field">
                <label for="runninghub_val_megapixels">分辨率/像素 (%像素%)</label>
                <select id="runninghub_val_megapixels" class="st-chatu8-select">
                    <option value="0.2">0.2 MP (640 × 360)</option>
                    <option value="0.3">0.3 MP (768 × 432)</option>
                    <option value="0.4">0.4 MP (854 × 480)</option>
                    <option value="0.5">0.5 MP (960 × 540)</option>
                    <option value="0.6">0.6 MP (1024 × 576)</option>
                    <option value="0.7">0.7 MP (1120 × 630)</option>
                    <option value="0.8">0.8 MP (1200 × 675)</option>
                    <option value="0.9" selected>0.9 MP (1280 × 720)</option>
                    <option value="1.0">1.0 MP (1344 × 756)</option>
                    <option value="1.1">1.1 MP (1408 × 792)</option>
                    <option value="1.2">1.2 MP (1472 × 828)</option>
                    <option value="1.3">1.3 MP (1536 × 864)</option>
                    <option value="1.4">1.4 MP (1600 × 900)</option>
                    <option value="1.5">1.5 MP (1632 × 918)</option>
                    <option value="1.6">1.6 MP (1696 × 954)</option>
                    <option value="1.7">1.7 MP (1744 × 981)</option>
                    <option value="1.8">1.8 MP (1792 × 1008)</option>
                    <option value="1.9">1.9 MP (1840 × 1035)</option>
                    <option value="2.0">2.0 MP (1920 × 1080)</option>
                </select>
            </div>
            <div class="st-chatu8-field">
                <label for="runninghub_val_seed">随机种子 (%种子%)</label>
                <input type="number" id="runninghub_val_seed" class="st-chatu8-text-input" value="-1" placeholder="-1为随机">
            </div>
            <div class="st-chatu8-field">
                <label for="runninghub_val_default_img">默认图片兜底</label>
                <input type="text" id="runninghub_val_default_img" class="st-chatu8-text-input" placeholder="未上传图片时的文件名兜底">
            </div>
            <div class="st-chatu8-field">
                <label for="runninghub_val_default_aud">默认音频兜底</label>
                <input type="text" id="runninghub_val_default_aud" class="st-chatu8-text-input" placeholder="未上传音频时的文件名兜底">
            </div>
        </div>
    </div>

    <!-- 图片加载与控制 (1~9) -->
    <div class="st-chatu8-settings-section">
        <h3>图片加载与控制 (1~9)</h3>
        <p style="font-size: 12px; color: var(--st-chatu8-text-secondary, #888); margin-bottom: 12px;">设置各图片分支开关模式并上传参考图像（支持开启、跳过 Bypass、停用 Mute）</p>
        <div class="st-chatu8-grid" id="runninghub_img_container" style="grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px;">
            <!-- 由 JS 动态生成 1~9 号卡片 -->
        </div>
    </div>

    <!-- 音频加载与控制 (1~3) -->
    <div class="st-chatu8-settings-section">
        <h3>音频加载与控制 (1~3)</h3>
        <p style="font-size: 12px; color: var(--st-chatu8-text-secondary, #888); margin-bottom: 12px;">设置各音频分支开关模式并上传参考音频（支持开启、跳过 Bypass、停用 Mute）</p>
        <div class="st-chatu8-grid" id="runninghub_aud_container" style="grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px;">
            <!-- 由 JS 动态生成 1~3 号卡片 -->
        </div>
    </div>

    <!-- 视频生成测试 -->
    <div class="st-chatu8-settings-section">
        <h3>视频生成测试</h3>
        <p style="font-size: 12px; color: var(--st-chatu8-text-secondary, #888); margin-bottom: 12px;">使用当前页面的工作流、生成参数及上传的分支媒体直接发起视频生成测试</p>
        
        <!-- LLM 辅助生成提示词 -->
        <div class="st-chatu8-field-col" style="margin-bottom: 12px;">
            <label for="runninghub_video_test_demand">生成需求 (用户需求 / %用户需求%)</label>
            <textarea id="runninghub_video_test_demand" class="st-chatu8-textarea" rows="2" placeholder="输入视频生成需求，例如：描述主体动作、镜头推进、光影氛围等（将作为 {{用户需求}} 传给 LLM）"></textarea>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
                <button type="button" id="runninghub_test_llm_img2vid_btn" class="st-chatu8-btn" title="调用 LLM【图生视频】，将图片 1 作为参考生成提示词并填入下方">
                    <i class="fa-solid fa-wand-magic-sparkles" style="color: #60a5fa;"></i> 单图参考
                </button>
                <button type="button" id="runninghub_test_llm_ref2vid_btn" class="st-chatu8-btn" title="调用 LLM【视材准备】，将开启的图片 1~9 与音频作为参考生成提示词并填入下方">
                    <i class="fa-solid fa-wand-magic-sparkles" style="color: #ec4899;"></i> 多图参考
                </button>
            </div>
        </div>

        <div class="st-chatu8-field-col" style="margin-bottom: 12px;">
            <label for="runninghub_video_test_prompt">测试提示词 (Prompt / %提示词%)</label>
            <textarea id="runninghub_video_test_prompt" class="st-chatu8-textarea" rows="3" placeholder="输入视频生成提示词，例如：1girl, solo, smiling, standing in a flower garden, windy, beautiful lighting, masterpiece, high quality..."></textarea>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;">
            <button id="runninghub_test_ref2vid_btn" class="st-chatu8-btn primary" title="使用当前页面参考生视频工作流，并传入所有开启的图片 1~9 与音频 1~3">
                <i class="fa-solid fa-film"></i> 多图生视频
            </button>
            <button id="runninghub_test_img2vid_btn" class="st-chatu8-btn primary" title="使用当前页面图生视频工作流，仅将图片 1 作为参考图，其余分支无效">
                <i class="fa-solid fa-image"></i> 单图生视频
            </button>
            <button id="runninghub_test_cancel_btn" class="st-chatu8-btn danger" style="display: none;">
                <i class="fa-solid fa-stop"></i> 取消任务
            </button>
        </div>

        <!-- 测试运行状态日志 -->
        <div id="runninghub_video_test_status" style="display: none; margin-bottom: 15px; padding: 10px 14px; border-radius: 6px; font-size: 12px; line-height: 1.5; background: var(--st-chatu8-bg-secondary, rgba(255,255,255,0.05)); border: 1px solid var(--st-chatu8-border-color, rgba(255,255,255,0.1));">
        </div>

        <!-- 视频预览区 -->
        <div id="runninghub_video_test_preview_container" style="display: none; flex-direction: column; gap: 10px; padding: 15px; border-radius: 8px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--st-chatu8-border-color, rgba(255,255,255,0.15));">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: bold; font-size: 13px; color: var(--st-chatu8-text-primary, #fff);"><i class="fa-solid fa-circle-play" style="color: #4caf50; margin-right: 6px;"></i>生成结果预览</span>
                <div style="display: flex; gap: 8px;">
                    <a id="runninghub_video_test_download_btn" class="st-chatu8-btn" download="runninghub_generated_video.mp4" style="padding: 3px 10px; font-size: 12px; text-decoration: none;" title="下载视频"><i class="fa-solid fa-download"></i> 下载</a>
                    <a id="runninghub_video_test_open_btn" class="st-chatu8-btn" target="_blank" style="padding: 3px 10px; font-size: 12px; text-decoration: none;" title="在新标签页打开原文件"><i class="fa-solid fa-arrow-up-right-from-square"></i> 原链接</a>
                </div>
            </div>
            <div style="display: flex; justify-content: center; align-items: center; background: #000; border-radius: 6px; overflow: hidden; max-height: 500px;">
                <video id="runninghub_video_test_player" controls loop playsinline preload="metadata" style="max-width: 100%; max-height: 480px; width: auto; height: auto; outline: none;"></video>
            </div>
        </div>
    </div>
</div>
